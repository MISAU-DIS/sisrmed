server {
#    listen 80;
    listen 443 ssl;
    server_name sis-rme.local;

    include /etc/nginx/conf.d/options/ssl.conf;
    include /etc/nginx/conf.d/options/default_gzip.conf;
    include /etc/nginx/conf.d/options/additional_security_params.conf;
    client_max_body_size 2G;

    access_log /var/log/nginx/sis-rme_access.log json_analytics;

    ssl_certificate     /etc/nginx/certs/chain/sis-rme.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/pkey/sis-rme.local.key.pem;

    # Optional: force HTTP -> HTTPS
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://sis-rme_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_request_buffering on;

        proxy_redirect off;
    }

    location /dde/ {
        rewrite ^/dde/?(.*)$ /$1 break;
        proxy_pass http://sis-dde_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    location ^~ /assets/ {
        proxy_pass http://sis-dde_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }   

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


