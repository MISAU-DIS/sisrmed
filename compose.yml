include:
 - path: mpi/compose.yml
   env_file: ./mpi/.env

services:
  frontend-init:
    image: ghcr.io/misau-dis/sis-h-core:1.1.2-beta
      #image: ghcr.io/misau-dis/sis-h-core:1.1.0-beta
      #pull_policy: always
    volumes:
      - frontend-static:/frontend
    command: ["sh", "-c", "rm -rf /frontend/* /frontend/.* 2>/dev/null; cp -a /var/www/html/. /frontend/"]
    restart: "no"

  gateway:
    image: nginx:1.29.0-alpine
    container_name: sis-h-gateway
    restart: "unless-stopped"
    depends_on:
      frontend-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - 81:80
    volumes:
      - /etc/localtime:/etc/localtime
      - frontend-static:/var/www/html/frontend:ro
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
  api:
    image: ghcr.io/misau-dis/sis-h-api:1.1.2-beta
      #image: ghcr.io/misau-dis/sis-h-api:1.1.0-beta
    container_name: sis-h-api
      # pull_policy: always
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q 'pong' || exit 1"]
      timeout: 5s
      start_period: 1.5m
    env_file: ./.env
    # environment:
      # APP_NAME: SIS-H API
      # APP_ENV: production
      # APP_DEBUG: true
      # APP_KEY:
      # APP_TIMEZONE: Africa/Maputo
      # DB_CONNECTION: mysql
      # DB_HOST: sis-h-db
      # DB_PORT: 3306
      # DB_USERNAME:
      # DB_PASSWORD:
      # DB_DATABASE:
      # DDE_PROXY_URL:
      # DDE_TIMEOUT:
      # DDE_USERNAME:
      # DDE_PASSWORD:
      # DEFAULT_HEALTH_FACILITY_ID:
      # LOG_STACK: daily,stderr
      # LOG_DAILY_DAYS: 7
    volumes:
      - /etc/localtime:/etc/localtime
      - api-storage:/var/www/html/api/storage
  db:
    image: mysql:9.3
    container_name: sis-h-db
    restart: "unless-stopped"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      interval: 5s
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: moz_emr_api
    volumes:
      - /etc/localtime:/etc/localtime
      - ./conf/mysql.cnf:/etc/my.cnf
      - db-data:/var/lib/mysql
      - /var/log/mysql:/var/log/mysql

  redis:
    image: redis:7-alpine
    container_name: sis-h-redis
    restart: "unless-stopped"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      interval: 5s
    volumes:
      - /etc/localtime:/etc/localtime

volumes:
  db-data:
  api-storage:
  frontend-static:

